name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Find root .tex files
        id: find
        run: |
          files=$(grep -rlE --include='*.tex' '^[[:space:]]*\\documentclass' . | sed 's|^\./||' | sort)
          echo "Root files found:"
          echo "$files"
          if [ -z "$files" ]; then
            echo "No files with \\documentclass found."
            exit 1
          fi
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ steps.find.outputs.files }}
          args: -pdf -cd -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: "**/*.log"
          if-no-files-found: ignore

      - name: Assemble site
        run: |
          mkdir site
          cp index.html site/
          find . -name '*.pdf' -not -path './site/*' -exec cp {} site/ \;
          echo "Site contents:"
          ls -l site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
